name: desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cache_probe:
        description: Allow this manual run to seed Linux caches for a repeat-run cache check
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  # A cancelled main run could leave a release half published; main runs queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  version:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        name: Decide whether this main push ships a release
        run: |
          python3 scripts/desktop-auto-release.py plan | tee plan.txt
          if [ "${{ github.event_name }}" != push ] || [ "${{ github.ref }}" != refs/heads/main ]; then
            sed -i 's/^release=.*/release=false/' plan.txt
          fi
          cat plan.txt >> "$GITHUB_OUTPUT"

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner: windows-latest
          - os: ubuntu-latest
            runner: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Shared theme tokens
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/generate-theme.py --check
      # Not dtolnay/rust-toolchain on Linux: several self-hosted runner
      # processes share one Unix user, and a shared ~/.rustup lets one job
      # delete rustc from under another. The script isolates RUSTUP_HOME.
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          missing=""
          for p in build-essential cmake pkg-config libasound2-dev libclang-dev; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "install ok installed" || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            sudo apt-get -o DPkg::Lock::Timeout=600 update
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y $missing
          fi
      - name: Rust toolchain (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci-rustup.sh clippy
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          components: clippy
      # Self-hosted runners skip it: their cache archive holds absolute paths of
      # another runner's directory, and each keeps a warm CARGO_HOME instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.cache_probe && runner.os == 'Linux') }}
          workspaces: core
          # sherpa-onnx-sys downloads its native libraries here; the cache prunes it but keeps
          # the build script's output, which would then link against a missing directory.
          cache-directories: core/target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt
          cache-bin: "false"
      - name: Rerun sherpa-onnx's build script after a cache restore
        shell: bash
        run: bash scripts/ci-sherpa-cache.sh core/target
      - name: Rust lint
        run: cargo clippy --manifest-path core/Cargo.toml --lib --tests -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml --lib
      - name: Local keyboard policy
        run: |
          cargo fmt --manifest-path core/keyboard/Cargo.toml -- --check
          cargo clippy --manifest-path core/keyboard/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path core/keyboard/Cargo.toml
      - name: Rust lint and tests without local speaker recognition
        run: |
          cargo clippy --manifest-path core/Cargo.toml --lib --tests --no-default-features -- -D warnings
          cargo test --manifest-path core/Cargo.toml --lib --no-default-features speakers
      - name: Speaker pipeline
        run: |
          cargo clippy --manifest-path core/speakers/Cargo.toml --all-targets --features onnx -- -D warnings
          cargo test --manifest-path core/speakers/Cargo.toml --features onnx

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            runner: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    needs: [changes, version]
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TRANSCRIBE_CMAKE_ARGS: ${{ vars.TRANSCRIBE_CMAKE_ARGS }}
      CMAKE_ARGS: ${{ vars.CMAKE_ARGS }}
      # linuxdeploy is itself an AppImage; self-hosted boxes may lack FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # SHA-1 of the "Pennel Release Signing" certificate. Replacing the certificate resets every
      # user's macOS privacy approvals, so it must be a deliberate change here.
      PENNEL_RELEASE_CERT_SHA1: 5b347dcd6dc39a096da00c42aad7639a30320f62
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - name: Shared theme tokens
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} ../../scripts/generate-theme.py --check
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          packages="libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
            libasound2-dev libx11-dev libxtst-dev libxi-dev libdbus-1-dev patchelf cmake file
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
            pulseaudio-utils x11-utils wl-clipboard build-essential curl pkg-config"
          missing=""
          for p in $packages; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "install ok installed" || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            sudo apt-get -o DPkg::Lock::Timeout=600 update
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y $missing
          fi
      - name: Check Linux media and desktop integration prerequisites
        if: runner.os == 'Linux'
        run: |
          for element in fdsrc fdsink rawaudioparse audioconvert audioresample aacparse mp4mux qtdemux avenc_aac avdec_aac; do
            gst-inspect-1.0 "$element" >/dev/null
          done
          command -v pactl
          command -v xprop
          command -v wl-copy
      - name: Rust toolchain (Linux)
        if: runner.os == 'Linux'
        run: bash ../../scripts/ci-rustup.sh clippy rustfmt
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.cache_probe && runner.os == 'Linux') }}
          workspaces: apps/desktop/src-tauri
          # sherpa-onnx-sys downloads its native libraries here; the cache prunes it but keeps
          # the build script's output, which would then link against a missing directory.
          cache-directories: apps/desktop/src-tauri/target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt
          cache-bin: "false"
      - name: Rerun sherpa-onnx's build script after a cache restore
        shell: bash
        working-directory: .
        run: bash scripts/ci-sherpa-cache.sh apps/desktop/src-tauri/target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # The self-hosted boxes keep ~/.npm between jobs; the post-step cache save hung there.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Frontend
        run: npm run build
      - name: Frontend tests
        run: npm test
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # A stable certificate keeps the designated requirement, and with it the user's privacy
      # approvals, identical across releases. Forks and runs without the secret sign ad hoc.
      - name: Choose the Mac signing identity
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RELEASE_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$RELEASE_IDENTITY" ]; then
            echo "::notice::No release signing certificate available; the Mac bundle is signed ad hoc"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain="$RUNNER_TEMP/pennel-signing.keychain-db"
          bash ../../scripts/import-mac-signing-cert.sh "$RELEASE_IDENTITY" "$keychain"
          echo "PENNEL_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$RELEASE_IDENTITY" >> "$GITHUB_ENV"
          echo "PENNEL_EXPECTED_REQUIREMENT=identifier \"dev.pennel.Pennel\" and certificate root = H\"$PENNEL_RELEASE_CERT_SHA1\"" >> "$GITHUB_ENV"
      - name: Installers with verified non-Mac x64 CPU baseline
        env:
          PENNEL_BUILD_TARGET: ${{ matrix.target }}
          PENNEL_BUNDLE_FORMATS: ${{ matrix.bundles }}
          PENNEL_RELEASE_VERSION: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.version || '' }}
        shell: bash
        run: |
          py=python
          command -v python3 >/dev/null && py=python3
          "$py" - <<'PY'
          import importlib.util
          import json
          import os
          import shutil
          import sys
          from pathlib import Path
          sys.dont_write_bytecode = True
          spec = importlib.util.spec_from_file_location("desktop_release", Path("../../scripts/desktop-release.py").resolve())
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          npx = shutil.which("npx.cmd" if sys.platform == "win32" else "npx")
          if not npx:
              raise SystemExit("Node.js/npm is required to build desktop installers")
          config = None
          if os.environ.get("PENNEL_RELEASE_VERSION"):
              config = Path("../../build/tauri.version.conf.json").resolve()
              config.parent.mkdir(parents=True, exist_ok=True)
              config.write_text(json.dumps({"version": os.environ["PENNEL_RELEASE_VERSION"]}), encoding="utf-8")
          release.build_distributable(npx, os.environ["PENNEL_BUILD_TARGET"], os.environ["PENNEL_BUNDLE_FORMATS"], config, os.environ, sys.platform)
          PY
      - name: Inspect packaged Mac app without opening it
        if: runner.os == 'macOS'
        run: |
          python3 ../../scripts/verify-desktop-bundle.py src-tauri/target/${{ matrix.target }}/release/bundle/macos/Pennel.app \
            --output ../../build/mac-bundle-inspection.json \
            ${PENNEL_EXPECTED_REQUIREMENT:+--designated-requirement "$PENNEL_EXPECTED_REQUIREMENT"}
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.PENNEL_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$PENNEL_SIGNING_KEYCHAIN"
      - uses: actions/upload-artifact@v5
        with:
          name: pennel-${{ matrix.target }}-development
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            build/mac-bundle-inspection.json

      # Installers are large; do not leave them on a shared runner's disk.
      - name: Remove bundles from the runner
        if: always() && runner.os == 'Linux'
        run: rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"

  packaging-tools:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - name: Release configuration, manifest gates and bundle metadata tests
        run: make packaging-test

  release:
    needs: [version, core, app, packaging-tools]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: pennel-*-development
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          # Self-hosted runners can keep bundles of earlier versions; ship only this one.
          mapfile -t files < <(find dist -type f -name "Pennel_${VERSION}_*" \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \))
          for kind in _aarch64.dmg -setup.exe .msi .deb .AppImage; do
            printf '%s\n' "${files[@]}" | grep -q -- "$kind\$" || { echo "::error::missing $kind for $VERSION"; exit 1; }
          done
          sha256sum "${files[@]}" | sed 's#  .*/#  #' > SHA256SUMS.txt
          gh release create "v${VERSION}" "${files[@]}" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Pennel ${VERSION}" --generate-notes
      - name: Update the Homebrew cask
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; the cask stays on the previous version"
            exit 0
          fi
          dmg=$(find dist -type f -name "Pennel_${VERSION}_aarch64.dmg" | head -1)
          sha=$(sha256sum "$dmg" | cut -d' ' -f1)
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:pennel-app/homebrew-pennel.git tap
          mkdir -p tap/Casks
          python3 scripts/desktop-auto-release.py cask "$VERSION" "$sha" --repository "$GITHUB_REPOSITORY" > tap/Casks/pennel.rb
          cd tap
          git config user.name "pennel-release"
          git config user.email "pennel-release@users.noreply.github.com"
          git add Casks/pennel.rb
          git diff --cached --quiet && exit 0
          git commit -m "pennel ${VERSION}"
          git push origin HEAD
          rm -f ~/.ssh/tap_key
