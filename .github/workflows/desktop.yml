name: desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: macOS-first validation or explicit all-platform validation
        type: choice
        default: macos
        options:
          - macos
          - all
      cache_probe:
        description: Allow this manual run to seed Linux caches for a repeat-run cache check
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  # A cancelled main run could leave a release half published; main runs queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      platforms: ${{ inputs.platforms || 'macos' }}

  version:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        name: Decide whether this main push ships a release
        run: |
          python3 scripts/desktop-auto-release.py plan | tee plan.txt
          if [ "${{ github.event_name }}" != push ] || [ "${{ github.ref }}" != refs/heads/main ]; then
            sed -i 's/^release=.*/release=false/' plan.txt
          fi
          cat plan.txt >> "$GITHUB_OUTPUT"

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.cross_platform == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner: windows-latest
          - os: ubuntu-latest
            runner: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Shared theme tokens
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/generate-theme.py --check
      # Not dtolnay/rust-toolchain on Linux: several self-hosted runner
      # processes share one Unix user, and a shared ~/.rustup lets one job
      # delete rustc from under another. The script isolates RUSTUP_HOME.
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          missing=""
          for p in build-essential cmake pkg-config libasound2-dev libclang-dev; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "install ok installed" || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            sudo apt-get -o DPkg::Lock::Timeout=600 update
            # missing is an intentional list of package names.
            # shellcheck disable=SC2086
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y $missing
          fi
      - name: Rust toolchain (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci-rustup.sh clippy
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          components: clippy
      # Self-hosted runners skip it: their cache archive holds absolute paths of
      # another runner's directory, and each keeps a warm CARGO_HOME instead.
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted' && needs.changes.outputs.dependency_cache != 'cold'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.cache_probe && runner.os == 'Linux') }}
          workspaces: core
          # sherpa-onnx-sys downloads its native libraries here; the cache prunes it but keeps
          # the build script's output, which would then link against a missing directory.
          cache-directories: core/target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt
          cache-bin: "false"
      - name: Rerun sherpa-onnx's build script after a cache restore
        shell: bash
        run: bash scripts/ci-sherpa-cache.sh core/target
      - name: Rust lint
        run: cargo clippy --manifest-path core/Cargo.toml --lib --tests -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml --lib
      - name: Local keyboard policy
        run: |
          cargo fmt --manifest-path core/keyboard/Cargo.toml -- --check
          cargo clippy --manifest-path core/keyboard/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path core/keyboard/Cargo.toml
      - name: Rust lint and tests without local speaker recognition
        run: |
          cargo clippy --manifest-path core/Cargo.toml --lib --tests --no-default-features -- -D warnings
          cargo test --manifest-path core/Cargo.toml --lib --no-default-features speakers
      - name: Speaker pipeline
        run: |
          cargo clippy --manifest-path core/speakers/Cargo.toml --all-targets --features onnx -- -D warnings
          cargo test --manifest-path core/speakers/Cargo.toml --features onnx

  app:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.desktop_matrix) }}
    needs: [changes, version]
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.os == 'ubuntu-22.04' && (vars.LINUX_RUNNER || matrix.os) || matrix.os }}
    timeout-minutes: 90
    env:
      TRANSCRIBE_CMAKE_ARGS: ${{ vars.TRANSCRIBE_CMAKE_ARGS }}
      CMAKE_ARGS: ${{ vars.CMAKE_ARGS }}
      # linuxdeploy is itself an AppImage; self-hosted boxes may lack FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - name: Shared theme tokens
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} ../../scripts/generate-theme.py --check
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - name: Linux packages
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          # The hosted Azure HTTP mirror can stall after index fallback; retain signed Ubuntu sources over HTTPS.
          if [ "${{ runner.environment }}" = github-hosted ] && [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E 's#^http://azure\.archive\.ubuntu\.com/ubuntu([/[:space:]]|$)#https://archive.ubuntu.com/ubuntu\1#' /etc/apt/apt-mirrors.txt
          fi
          packages="libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
            libasound2-dev libx11-dev libxtst-dev libxi-dev libdbus-1-dev patchelf cmake file
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
            pulseaudio-utils x11-utils wl-clipboard build-essential curl pkg-config"
          missing=""
          for p in $packages; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q "install ok installed" || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            apt_options=(-o DPkg::Lock::Timeout=600 -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y $missing
          fi
      - name: Check Linux media and desktop integration prerequisites
        if: runner.os == 'Linux'
        run: |
          for element in fdsrc fdsink rawaudioparse audioconvert audioresample aacparse mp4mux qtdemux avenc_aac avdec_aac; do
            gst-inspect-1.0 "$element" >/dev/null
          done
          command -v pactl
          command -v xprop
          command -v wl-copy
      - name: Rust toolchain (Linux)
        if: runner.os == 'Linux'
        run: bash ../../scripts/ci-rustup.sh clippy rustfmt
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted' && needs.changes.outputs.dependency_cache != 'cold'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.cache_probe && runner.os == 'Linux') }}
          workspaces: apps/desktop/src-tauri
          # sherpa-onnx-sys downloads its native libraries here; the cache prunes it but keeps
          # the build script's output, which would then link against a missing directory.
          cache-directories: apps/desktop/src-tauri/target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt
          cache-bin: "false"
      - name: Rerun sherpa-onnx's build script after a cache restore
        shell: bash
        working-directory: .
        run: bash scripts/ci-sherpa-cache.sh apps/desktop/src-tauri/target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # The self-hosted boxes keep ~/.npm between jobs; the post-step cache save hung there.
          cache: ${{ runner.environment == 'github-hosted' && needs.changes.outputs.dependency_cache != 'cold' && 'npm' || '' }}
          package-manager-cache: ${{ needs.changes.outputs.dependency_cache != 'cold' }}
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Frontend
        if: needs.changes.outputs.ci_mode != 'candidate'
        run: npm run build
      - name: Frontend tests
        run: npm test
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust lint
        if: needs.changes.outputs.ci_mode != 'candidate'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        if: needs.changes.outputs.ci_mode != 'candidate'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Prepare personal-team Mac distribution credentials
        if: runner.os == 'macOS' && needs.version.outputs.release == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.PENNEL_MAC_DEVELOPER_ID_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PENNEL_MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          RELEASE_IDENTITY: ${{ vars.PENNEL_MAC_DEVELOPER_ID_IDENTITY }}
          PENNEL_MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.PENNEL_MAC_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_CONTENT: ${{ secrets.PENNEL_MAC_NOTARY_API_KEY_CONTENT }}
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path
          import subprocess
          required = ("APPLE_CERTIFICATE", "APPLE_CERTIFICATE_PASSWORD", "RELEASE_IDENTITY", "PENNEL_MAC_PROVISIONING_PROFILE_BASE64")
          if not all(os.environ.get(key) for key in required):
              raise SystemExit("Publishing requires the personal Developer ID certificate and macOS provisioning profile; ad-hoc releases are disabled")
          directory = Path(os.environ["RUNNER_TEMP"])
          keychain = directory / "pennel-signing.keychain-db"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"PENNEL_SIGNING_KEYCHAIN={keychain}\n")
          subprocess.run(["bash", "../../scripts/import-mac-signing-cert.sh", os.environ["RELEASE_IDENTITY"], str(keychain)], check=True)
          profile = directory / "pennel.provisionprofile"
          profile.write_bytes(base64.b64decode(os.environ["PENNEL_MAC_PROVISIONING_PROFILE_BASE64"], validate=True))
          profile.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"PENNEL_MAC_PROVISIONING_PROFILE={profile}\n")
              if os.environ.get("APPLE_API_KEY_CONTENT"):
                  key = directory / "pennel-notarization.p8"
                  key.write_text(os.environ["APPLE_API_KEY_CONTENT"])
                  key.chmod(0o600)
                  output.write(f"APPLE_API_KEY_PATH={key}\n")
      - name: Build and verify the notarized Mac Homebrew distribution
        if: runner.os == 'macOS' && needs.version.outputs.release == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.PENNEL_MAC_DEVELOPER_ID_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.PENNEL_MAC_NOTARY_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.PENNEL_MAC_NOTARY_API_KEY }}
          APPLE_ID: ${{ secrets.PENNEL_MAC_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.PENNEL_MAC_NOTARY_APPLE_PASSWORD }}
          APPLE_TEAM_ID: B538Q2K76C
          PENNEL_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 ../../scripts/desktop-release.py "$PENNEL_RELEASE_VERSION" --homebrew
          cp "../../build/desktop-release/$PENNEL_RELEASE_VERSION/aarch64-apple-darwin/mac-notarization.json" ../../build/mac-notarization.json
      - name: Installers with verified non-Mac x64 CPU baseline
        if: runner.os != 'macOS' || needs.version.outputs.release != 'true'
        env:
          PENNEL_BUILD_TARGET: ${{ matrix.target }}
          PENNEL_BUNDLE_FORMATS: ${{ matrix.bundles }}
          PENNEL_RELEASE_VERSION: ${{ needs.version.outputs.release == 'true' && needs.version.outputs.version || '' }}
        shell: bash
        run: |
          py=python
          command -v python3 >/dev/null && py=python3
          "$py" - <<'PY'
          import importlib.util
          import json
          import os
          import shutil
          import sys
          from pathlib import Path
          sys.dont_write_bytecode = True
          spec = importlib.util.spec_from_file_location("desktop_release", Path("../../scripts/desktop-release.py").resolve())
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          npx = shutil.which("npx.cmd" if sys.platform == "win32" else "npx")
          if not npx:
              raise SystemExit("Node.js/npm is required to build desktop installers")
          config = None
          if os.environ.get("PENNEL_RELEASE_VERSION"):
              config = Path("../../build/tauri.version.conf.json").resolve()
              config.parent.mkdir(parents=True, exist_ok=True)
              config.write_text(json.dumps({"version": os.environ["PENNEL_RELEASE_VERSION"]}), encoding="utf-8")
          environment = dict(os.environ)
          if sys.platform == "darwin":
              # Non-publishing CI has no entitlement to either installed Keychain group.
              environment["APPLE_SIGNING_IDENTITY"] = "-"
          release.build_distributable(npx, os.environ["PENNEL_BUILD_TARGET"], os.environ["PENNEL_BUNDLE_FORMATS"], config, environment, sys.platform)
          PY
      # Tauri's hook builds frontendDist before generate_context! in backend checks.
      - name: Rust lint after packaging
        if: needs.changes.outputs.ci_mode == 'candidate'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests after packaging
        if: needs.changes.outputs.ci_mode == 'candidate'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Inspect packaged Mac app without opening it
        if: runner.os == 'macOS'
        env:
          PENNEL_PUBLISHING: ${{ needs.version.outputs.release }}
        run: |
          args=()
          if [ "$PENNEL_PUBLISHING" = true ]; then
            args+=(--require-developer-id --require-private-keychain)
          fi
          python3 ../../scripts/verify-desktop-bundle.py src-tauri/target/${{ matrix.target }}/release/bundle/macos/Pennel.app \
            --output ../../build/mac-bundle-inspection.json \
            "${args[@]}"
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.PENNEL_SIGNING_KEYCHAIN != ''
        run: |
          security delete-keychain "$PENNEL_SIGNING_KEYCHAIN"
          rm -f "$RUNNER_TEMP/pennel.provisionprofile" "$RUNNER_TEMP/pennel-notarization.p8"
      - uses: actions/upload-artifact@v5
        with:
          name: pennel-${{ matrix.target }}-development
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            build/mac-bundle-inspection.json
            build/mac-notarization.json

      # Installers are large; do not leave them on a shared runner's disk.
      - name: Remove bundles from the runner
        if: always() && runner.os == 'Linux'
        run: rm -rf "src-tauri/target/${{ matrix.target }}/release/bundle"

  packaging-tools:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - name: Release configuration, manifest gates and bundle metadata tests
        run: make packaging-test

  release:
    needs: [changes, version, app, packaging-tools]
    if: needs.version.outputs.release == 'true' && needs.changes.outputs.platform_scope == 'macos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: pennel-*-development
          path: dist
          merge-multiple: true
      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          # Publish only the current Mac artifact during the macOS-first phase.
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find dist -type f -name "Pennel_${VERSION}_aarch64.dmg" -print0)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected exactly one Mac DMG for $VERSION"
            exit 1
          fi
          receipt=$(find dist -type f -name mac-notarization.json | head -1)
          python3 scripts/desktop-auto-release.py verify-mac "$VERSION" "${files[0]}" "$receipt"
          sha256sum "${files[@]}" | sed 's#  .*/#  #' > SHA256SUMS.txt
          gh release create "v${VERSION}" "${files[@]}" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Pennel ${VERSION}" --generate-notes
      - name: Update the Homebrew cask
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; the cask stays on the previous version"
            exit 0
          fi
          dmg=$(find dist -type f -name "Pennel_${VERSION}_aarch64.dmg" | head -1)
          sha=$(sha256sum "$dmg" | cut -d' ' -f1)
          receipt=$(find dist -type f -name mac-notarization.json | head -1)
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:pennel-app/homebrew-pennel.git tap
          mkdir -p tap/Casks
          python3 scripts/desktop-auto-release.py cask "$VERSION" "$sha" --repository "$GITHUB_REPOSITORY" --notarization-receipt "$receipt" > tap/Casks/pennel.rb
          cd tap
          git config user.name "pennel-release"
          git config user.email "pennel-release@users.noreply.github.com"
          git add Casks/pennel.rb
          git diff --cached --quiet && exit 0
          git commit -m "pennel ${VERSION}"
          git push origin HEAD
          rm -f ~/.ssh/tap_key
