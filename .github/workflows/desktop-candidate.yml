name: signed desktop candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate semantic version (for example 0.2.0-beta.1)
        required: true
        type: string
      mac_build_number:
        description: Mac CFBundleVersion, greater than every previously distributed build
        required: true
        type: string
      previous_mac_build_number:
        description: Highest Mac CFBundleVersion already distributed
        required: true
        type: string
      mac_only:
        description: Build only the Mac candidate, independently of Windows/Linux release credentials
        type: boolean
        default: true
      updater_artifacts:
        description: Also require the existing Tauri updater keys and produce signed updater archives
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.mac_only && '[{"os":"macos-15","target":"aarch64-apple-darwin"}]' || '[{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TRANSCRIBE_CMAKE_ARGS: ${{ vars.TRANSCRIBE_CMAKE_ARGS }}
      CMAKE_ARGS: ${{ vars.CMAKE_ARGS }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      PENNEL_CANDIDATE_VERSION: ${{ inputs.version }}
      PENNEL_MAC_BUILD: ${{ inputs.mac_build_number }}
      PENNEL_PREVIOUS_MAC_BUILD: ${{ inputs.previous_mac_build_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.os == 'macOS'
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: apps/desktop/src-tauri
          # sherpa-onnx-sys downloads its native libraries here; the cache prunes it but keeps
          # the build script's output, which would then link against a missing directory.
          cache-directories: apps/desktop/src-tauri/target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt
      - name: Rerun sherpa-onnx's build script after a cache restore
        shell: bash
        run: bash scripts/ci-sherpa-cache.sh apps/desktop/src-tauri/target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Linux build and runtime prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libx11-dev libxtst-dev libxi-dev libdbus-1-dev patchelf cmake file \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            pulseaudio-utils x11-utils wl-clipboard
      - name: Prepare existing personal-team Mac signing and notarization credentials
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.PENNEL_MAC_NOTARY_API_KEY_CONTENT }}
          APPLE_CERTIFICATE: ${{ secrets.PENNEL_MAC_DEVELOPER_ID_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PENNEL_MAC_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          RELEASE_IDENTITY: ${{ vars.PENNEL_MAC_DEVELOPER_ID_IDENTITY }}
          PENNEL_MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.PENNEL_MAC_PROVISIONING_PROFILE_BASE64 }}
        shell: python
        run: |
          import os
          import base64
          import subprocess
          from pathlib import Path
          required = ("APPLE_CERTIFICATE", "APPLE_CERTIFICATE_PASSWORD", "RELEASE_IDENTITY", "PENNEL_MAC_PROVISIONING_PROFILE_BASE64")
          if not all(os.environ.get(key) for key in required):
              raise SystemExit("Personal Developer ID certificate and macOS profile are required")
          directory = Path(os.environ["RUNNER_TEMP"])
          keychain = directory / "pennel-signing.keychain-db"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"PENNEL_SIGNING_KEYCHAIN={keychain}\n")
          subprocess.run(["bash", "scripts/import-mac-signing-cert.sh", os.environ["RELEASE_IDENTITY"], str(keychain)], check=True)
          profile = directory / "pennel.provisionprofile"
          profile.write_bytes(base64.b64decode(os.environ["PENNEL_MAC_PROVISIONING_PROFILE_BASE64"], validate=True))
          profile.chmod(0o600)
          content = os.environ.get("APPLE_API_KEY_CONTENT", "")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"PENNEL_MAC_PROVISIONING_PROFILE={profile}\n")
              if content:
                  path = directory / "pennel-notarization.p8"
                  path.write_text(content, encoding="utf-8")
                  path.chmod(0o600)
                  output.write(f"APPLE_API_KEY_PATH={path}\n")
      - name: Import existing Windows signing certificate on the temporary runner
        if: runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64) { exit 0 }
          $path = Join-Path $env:RUNNER_TEMP 'pennel-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          "PENNEL_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          Remove-Item -LiteralPath $path
      - name: Install locked frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build and verify signed Mac candidate, without publication
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.PENNEL_MAC_DEVELOPER_ID_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.PENNEL_MAC_NOTARY_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.PENNEL_MAC_NOTARY_API_KEY }}
          APPLE_ID: ${{ secrets.PENNEL_MAC_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.PENNEL_MAC_NOTARY_APPLE_PASSWORD }}
          APPLE_TEAM_ID: B538Q2K76C
          PENNEL_UPDATER_ARTIFACTS: ${{ inputs.updater_artifacts }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          arguments = [
              sys.executable, "scripts/desktop-release.py", os.environ["PENNEL_CANDIDATE_VERSION"],
              "--build-number", os.environ["PENNEL_MAC_BUILD"],
              "--previous-build-number", os.environ["PENNEL_PREVIOUS_MAC_BUILD"],
          ]
          if os.environ["PENNEL_UPDATER_ARTIFACTS"] != "true":
              arguments.append("--homebrew")
          subprocess.run(arguments, check=True)
      - name: Build and verify signed Windows candidate, without publication
        if: runner.os == 'Windows'
        env:
          PENNEL_WINDOWS_SIGN_COMMAND: ${{ secrets.PENNEL_WINDOWS_SIGN_COMMAND }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          subprocess.run([sys.executable, "scripts/desktop-release.py", os.environ["PENNEL_CANDIDATE_VERSION"]], check=True)
      - name: Build Linux candidate with detached updater signatures, without publication
        if: runner.os == 'Linux'
        shell: python
        run: |
          import os
          import subprocess
          import sys
          subprocess.run([sys.executable, "scripts/desktop-release.py", os.environ["PENNEL_CANDIDATE_VERSION"]], check=True)
      - uses: actions/upload-artifact@v5
        with:
          name: pennel-${{ matrix.target }}-signed-candidate
          if-no-files-found: error
          path: |
            build/desktop-release/**/*.dmg
            build/desktop-release/**/*.exe
            build/desktop-release/**/*.msi
            build/desktop-release/**/*.app.tar.gz
            build/desktop-release/**/*.AppImage
            build/desktop-release/**/*.deb
            build/desktop-release/**/*.sig
            build/desktop-release/**/candidate.json
            build/desktop-release/**/mac-notarization.json
      - name: Remove temporary Mac credentials
        if: always() && runner.os == 'macOS' && env.PENNEL_SIGNING_KEYCHAIN != ''
        run: |
          security delete-keychain "$PENNEL_SIGNING_KEYCHAIN"
          rm -f "$RUNNER_TEMP/pennel.provisionprofile" "$RUNNER_TEMP/pennel-notarization.p8"
