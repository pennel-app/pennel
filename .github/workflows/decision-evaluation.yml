name: decision evaluation

on:
  pull_request:
    paths:
      - 'core/**'
      - 'evaluations/decision-models/**'
      - '.github/workflows/decision-evaluation.yml'
      - '.github/workflows/changes.yml'
      - 'scripts/ci-platforms.py'
      - 'scripts/tests/test_ci_platforms.py'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'evaluations/decision-models/**'
      - '.github/workflows/decision-evaluation.yml'
      - '.github/workflows/changes.yml'
      - 'scripts/ci-platforms.py'
      - 'scripts/tests/test_ci_platforms.py'
  workflow_dispatch:
    inputs:
      platforms:
        description: macOS-first validation or explicit all-platform validation
        type: choice
        default: macos
        options:
          - macos
          - all

concurrency:
  group: decision-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      platforms: ${{ inputs.platforms || 'macos' }}

  offline:
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.evaluation_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/evaluation-core-target
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ runner.os == 'Linux' && '3.11.18' || '3.11.9' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.dependency_cache != 'cold'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: core -> ../build/evaluation-core-target
      - name: Build evaluation-only bridge without native models
        run: cargo build --locked --manifest-path core/Cargo.toml --no-default-features --features evaluation --bin pennel-eval
      - name: Evaluation Rust checks
        run: cargo test --locked --manifest-path core/Cargo.toml --no-default-features --features evaluation --lib evaluation
      - name: Offline corpus, metrics and mocked transports
        run: python -B -m unittest discover -s evaluations/decision-models/tests -v
      - name: Real deterministic baselines and reproducible report
        run: python -B evaluations/decision-models/run.py --offline
      - uses: actions/upload-artifact@v4
        with:
          name: decision-evaluation-${{ matrix.os }}
          path: build/decision-model-evaluation/offline/
