name: affected checks

on:
  workflow_call:
    inputs:
      platforms:
        description: Desktop platform scope; all is available only for manual validation
        type: string
        default: macos
    outputs:
      platform_scope:
        value: ${{ jobs.changes.outputs.platform_scope }}
      cross_platform:
        value: ${{ jobs.changes.outputs.cross_platform }}
      desktop_matrix:
        value: ${{ jobs.changes.outputs.desktop_matrix }}
      evaluation_matrix:
        value: ${{ jobs.changes.outputs.evaluation_matrix }}
      core:
        value: ${{ jobs.changes.outputs.core }}
      platform:
        value: ${{ jobs.changes.outputs.platform }}
      app:
        value: ${{ jobs.changes.outputs.app }}
      packaging:
        value: ${{ jobs.changes.outputs.packaging }}
      ci_mode:
        value: ${{ jobs.changes.outputs.ci_mode }}
      qualification_id:
        value: ${{ jobs.changes.outputs.qualification_id }}
      dependency_cache:
        value: ${{ jobs.changes.outputs.dependency_cache }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platform_scope: ${{ steps.platforms.outputs.platform_scope }}
      cross_platform: ${{ steps.platforms.outputs.cross_platform }}
      desktop_matrix: ${{ steps.platforms.outputs.desktop_matrix }}
      evaluation_matrix: ${{ steps.platforms.outputs.evaluation_matrix }}
      core: ${{ steps.filter.outputs.core }}
      platform: ${{ steps.filter.outputs.platform }}
      app: ${{ steps.filter.outputs.app }}
      packaging: ${{ steps.filter.outputs.packaging }}
      ci_mode: ${{ steps.ci-mode.outputs.ci_mode }}
      qualification_id: ${{ steps.ci-mode.outputs.qualification_id }}
      dependency_cache: ${{ steps.ci-mode.outputs.dependency_cache }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Resolve CI qualification mode
        id: ci-mode
        env:
          PENNEL_CI_QUALIFICATION_CONFIG: ${{ vars.PENNEL_CI_QUALIFICATION_CONFIG }}
          PENNEL_CI_FORCE_SERIAL: ${{ vars.PENNEL_CI_FORCE_SERIAL }}
        run: python3 -B scripts/ci-mode.py
      - name: Resolve active desktop platforms
        id: platforms
        env:
          PENNEL_CI_PLATFORM_SCOPE: ${{ inputs.platforms }}
        run: python3 -B scripts/ci-platforms.py >> "$GITHUB_OUTPUT"
      - name: Test change selection
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_ci_*.py'
      - name: English diagnostic defaults
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_language_policy.py'
      - name: Select affected checks
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 scripts/ci-changes.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci-changes.py >> "$GITHUB_OUTPUT"
          fi
      - name: Upload actual CI mode receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-mode-${{ github.run_attempt }}
          path: build/ci-performance/mode.json
          if-no-files-found: error
          retention-days: 7
