name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  build-and-test:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Shared theme tokens
        run: make theme-check
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: core
          # sherpa-onnx-sys downloads its native libraries here; the cache prunes it but keeps
          # the build script's output, which would then link against a missing directory.
          cache-directories: core/target/sherpa-onnx-prebuilt
          key: sherpa-prebuilt
      - name: Rerun sherpa-onnx's build script after a cache restore
        shell: bash
        run: bash scripts/ci-sherpa-cache.sh core/target
      - name: Rust format
        run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path core/Cargo.toml --lib --tests -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path core/Cargo.toml --lib
      - name: Local keyboard policy
        run: |
          cargo fmt --manifest-path core/keyboard/Cargo.toml -- --check
          cargo clippy --manifest-path core/keyboard/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path core/keyboard/Cargo.toml
      - name: Rust lint without local models
        run: cargo clippy --manifest-path core/Cargo.toml --lib --tests --no-default-features -- -D warnings
      - name: Rust tests without local models
        run: cargo test --manifest-path core/Cargo.toml --no-default-features --lib
      - name: Speaker pipeline
        run: |
          cargo fmt --manifest-path core/speakers/Cargo.toml -- --check
          cargo clippy --manifest-path core/speakers/Cargo.toml --all-targets --features onnx -- -D warnings
          cargo test --manifest-path core/speakers/Cargo.toml --features onnx
      - name: macOS platform tests
        if: needs.changes.outputs.platform == 'true'
        run: swift test --package-path apps/macos-platform

  platform:
    needs: changes
    if: needs.changes.outputs.platform == 'true' && needs.changes.outputs.core != 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: macOS platform tests
        run: swift test --package-path apps/macos-platform

  required:
    needs: [changes, build-and-test, platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check selected job results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci-status.py
