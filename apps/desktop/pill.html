<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pennel</title>
  </head>
  <body>
    <div id="pill" hidden>
      <div id="preview" hidden><span id="preview-text"></span></div>
      <div id="status-layers">
        <div id="status" class="pill-status" role="status" aria-live="polite" aria-atomic="true">
          <span id="indicator" class="pill-indicator" aria-hidden="true"></span>
          <span id="label" class="pill-label"></span>
          <span id="detail" class="pill-detail" hidden></span>
          <span id="model-chip" class="pill-model-chip" hidden></span>
          <span id="hint" class="pill-hint" hidden></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/pill.ts"></script>
  </body>
</html>
