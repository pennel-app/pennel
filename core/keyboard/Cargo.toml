[package]
name = "pennel-keyboard"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Bounded, local typing policy for Pennel keyboard extensions"

[lib]
name = "pennel_typing"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
default = ["ffi"]
ffi = []

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
