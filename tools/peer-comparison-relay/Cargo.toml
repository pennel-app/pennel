[package]
name = "pennel-peer-comparison-relay"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

# Isolated qualification executable; ordinary application builds do not include it.
[workspace]

[dependencies]
base64 = "=0.23.1"
getrandom = "=0.4.3"
hmac = "=0.13.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "io-std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
zeroize = "=1.9.1"
